<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#687780"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#232F3E" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="944" rx="22" fill="#ffffff" stroke="#D5DBDB" stroke-width="2"/>
  <rect x="28" y="28" width="8" height="944" rx="4" fill="#FF9900"/>

  <text x="78" y="82" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2" fill="#FF9900">CONTAINER DEPLOYMENT</text>
  <text x="78" y="132" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#232F3E">Amazon ECS: EC2 vs Fargate</text>
  <text x="78" y="168" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5F6B72">Same container image. Different compute responsibility.</text>

  <!-- Build and deployment flow -->
  <g filter="url(#softShadow)">
    <rect x="78" y="214" width="272" height="136" rx="14" fill="#ffffff" stroke="#D5DBDB" stroke-width="2"/>
    <rect x="394" y="214" width="272" height="136" rx="14" fill="#ffffff" stroke="#D5DBDB" stroke-width="2"/>
    <rect x="710" y="214" width="272" height="136" rx="14" fill="#ffffff" stroke="#D5DBDB" stroke-width="2"/>
    <rect x="1026" y="214" width="496" height="136" rx="14" fill="#ffffff" stroke="#D5DBDB" stroke-width="2"/>
  </g>

  <line x1="350" y1="282" x2="386" y2="282" stroke="#687780" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="666" y1="282" x2="702" y2="282" stroke="#687780" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="982" y1="282" x2="1018" y2="282" stroke="#687780" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Docker image icon -->
  <g transform="translate(106 249)">
    <path d="M4 19 L39 5 L69 17 L34 32 Z" fill="#E7E9EA" stroke="#687780" stroke-width="2"/>
    <path d="M4 19 L4 58 L34 74 L34 32 Z" fill="#F7F8F8" stroke="#687780" stroke-width="2"/>
    <path d="M34 32 L69 17 L69 56 L34 74 Z" fill="#D5DBDB" stroke="#687780" stroke-width="2"/>
    <path d="M18 23 L34 16 L48 22 L32 29 Z" fill="#FF9900"/>
    <path d="M18 39 L32 46 L32 59 L18 52 Z" fill="#FF9900" opacity="0.8"/>
  </g>
  <text x="194" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#687780">01  BUILD</text>
  <text x="194" y="298" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#232F3E">Docker image</text>
  <text x="194" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">packaged application</text>

  <image x="420" y="242" width="70" height="70" preserveAspectRatio="xMidYMid meet" href="ecs-architecture-assets/Arch_Amazon-Elastic-Container-Registry_64@5x.png" xlink:href="ecs-architecture-assets/Arch_Amazon-Elastic-Container-Registry_64@5x.png"/>
  <text x="506" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#687780">02  STORE</text>
  <text x="506" y="298" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#232F3E">Amazon ECR</text>
  <text x="506" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">stores the image</text>

  <g transform="translate(740 247)">
    <rect x="3" y="2" width="52" height="67" rx="5" fill="#F7F8F8" stroke="#687780" stroke-width="2"/>
    <line x1="15" y1="19" x2="43" y2="19" stroke="#FF9900" stroke-width="3"/>
    <line x1="15" y1="35" x2="43" y2="35" stroke="#687780" stroke-width="3"/>
    <line x1="15" y1="51" x2="43" y2="51" stroke="#687780" stroke-width="3"/>
    <rect x="9" y="14" width="5" height="5" fill="#FF9900"/>
    <rect x="9" y="30" width="5" height="5" fill="#687780"/>
    <rect x="9" y="46" width="5" height="5" fill="#687780"/>
  </g>
  <text x="812" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#687780">03  DEFINE</text>
  <text x="812" y="298" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#232F3E">Task definition</text>
  <text x="812" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">how to run the container</text>

  <image x="1052" y="242" width="70" height="70" preserveAspectRatio="xMidYMid meet" href="ecs-architecture-assets/Arch_Amazon-Elastic-Container-Service_64@5x.png" xlink:href="ecs-architecture-assets/Arch_Amazon-Elastic-Container-Service_64@5x.png"/>
  <text x="1140" y="269" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#687780">04  RUN</text>
  <text x="1140" y="298" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#232F3E">Amazon ECS service</text>
  <text x="1140" y="326" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">keeps the desired tasks running</text>

  <!-- Branch from ECS to the two launch choices -->
  <line x1="1274" y1="350" x2="1274" y2="378" stroke="#687780" stroke-width="2.5"/>
  <line x1="430" y1="378" x2="1274" y2="378" stroke="#687780" stroke-width="2.5"/>
  <line x1="430" y1="378" x2="430" y2="406" stroke="#687780" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1170" y1="378" x2="1170" y2="406" stroke="#687780" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- EC2 launch type -->
  <rect x="78" y="406" width="704" height="432" rx="18" fill="#FBFCFC" stroke="#B7C5CC" stroke-width="2"/>
  <rect x="78" y="406" width="8" height="432" rx="4" fill="#FF9900"/>
  <rect x="86" y="406" width="696" height="70" rx="16" fill="#F4F7F8"/>
  <text x="112" y="445" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#232F3E">ECS on EC2</text>
  <text x="112" y="468" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5F6B72">EC2 launch type</text>
  <rect x="563" y="425" width="183" height="32" rx="16" fill="#FFF3E0" stroke="#FF9900" stroke-width="1.3"/>
  <text x="654.5" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#9A5B00">YOU MANAGE CAPACITY</text>

  <image x="112" y="500" width="62" height="62" preserveAspectRatio="xMidYMid meet" href="ecs-architecture-assets/Arch_Amazon-EC2-Auto-Scaling_64@5x.png" xlink:href="ecs-architecture-assets/Arch_Amazon-EC2-Auto-Scaling_64@5x.png"/>
  <text x="190" y="523" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232F3E">Auto Scaling Group</text>
  <text x="190" y="550" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">adds or removes EC2 instances</text>

  <rect x="112" y="586" width="636" height="170" rx="12" fill="#F0F7FA" stroke="#7EA9BB" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="136" y="617" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#365B6B">EC2 instance capacity (managed by you)</text>
  <image x="136" y="643" width="66" height="66" preserveAspectRatio="xMidYMid meet" href="ecs-architecture-assets/Arch_Amazon-EC2_64@5x.png" xlink:href="ecs-architecture-assets/Arch_Amazon-EC2_64@5x.png"/>
  <text x="169" y="727" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#365B6B">EC2</text>

  <rect x="246" y="646" width="210" height="82" rx="10" fill="#ffffff" stroke="#9CB7C3" stroke-width="1.8"/>
  <text x="266" y="674" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#232F3E">Task 1</text>
  <rect x="266" y="688" width="150" height="23" rx="11.5" fill="#FFF3E0"/>
  <text x="341" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A5B00">app container</text>

  <rect x="478" y="646" width="210" height="82" rx="10" fill="#ffffff" stroke="#9CB7C3" stroke-width="1.8"/>
  <text x="498" y="674" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#232F3E">Task 2</text>
  <rect x="498" y="688" width="150" height="23" rx="11.5" fill="#FFF3E0"/>
  <text x="573" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A5B00">app container</text>

  <text x="112" y="805" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#9A5B00">ASG → EC2 instance count</text>
  <text x="420" y="805" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#267342">Service Auto Scaling → task count</text>

  <!-- Fargate launch type -->
  <rect x="818" y="406" width="704" height="432" rx="18" fill="#FBFCFC" stroke="#B7C5CC" stroke-width="2"/>
  <rect x="818" y="406" width="8" height="432" rx="4" fill="#FF9900"/>
  <rect x="826" y="406" width="696" height="70" rx="16" fill="#F4F7F8"/>
  <text x="852" y="445" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#232F3E">ECS on Fargate</text>
  <text x="852" y="468" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5F6B72">Fargate launch type</text>
  <rect x="1318" y="425" width="177" height="32" rx="16" fill="#EAF6EE" stroke="#4E9F6D" stroke-width="1.3"/>
  <text x="1406.5" y="446" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#267342">AWS MANAGES CAPACITY</text>

  <image x="852" y="500" width="62" height="62" preserveAspectRatio="xMidYMid meet" href="ecs-architecture-assets/Arch_AWS-Fargate_64@5x.png" xlink:href="ecs-architecture-assets/Arch_AWS-Fargate_64@5x.png"/>
  <text x="930" y="523" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#232F3E">AWS Fargate</text>
  <text x="930" y="550" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">provides compute for each task</text>

  <rect x="852" y="586" width="636" height="170" rx="12" fill="#FFF9F1" stroke="#E8B56B" stroke-width="2"/>
  <text x="876" y="617" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#865B1A">AWS-managed compute • one isolated boundary per task</text>

  <rect x="880" y="635" width="285" height="110" rx="12" fill="none" stroke="#E8B56B" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="1156" y="635" width="285" height="110" rx="12" fill="none" stroke="#E8B56B" stroke-width="2" stroke-dasharray="7 5"/>

  <rect x="900" y="646" width="240" height="82" rx="10" fill="#ffffff" stroke="#E8B56B" stroke-width="1.8"/>
  <text x="924" y="674" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#232F3E">Task 1</text>
  <rect x="924" y="688" width="150" height="23" rx="11.5" fill="#FFF3E0"/>
  <text x="999" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A5B00">app container</text>

  <rect x="1176" y="646" width="240" height="82" rx="10" fill="#ffffff" stroke="#E8B56B" stroke-width="1.8"/>
  <text x="1200" y="674" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#232F3E">Task 2</text>
  <rect x="1200" y="688" width="150" height="23" rx="11.5" fill="#FFF3E0"/>
  <text x="1275" y="705" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A5B00">app container</text>

  <text x="852" y="805" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#267342">Service Auto Scaling → task count</text>
  <text x="1233" y="805" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5F6B72">no EC2 management</text>

  <!-- Bottom memory aid -->
  <rect x="78" y="872" width="1444" height="70" rx="14" fill="#232F3E"/>
  <text x="108" y="899" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#FF9900">THE KEY DISTINCTION</text>
  <text x="108" y="925" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#ffffff">Service Auto Scaling changes the number of tasks</text>
  <line x1="795" y1="891" x2="795" y2="925" stroke="#687780" stroke-width="1.5"/>
  <text x="836" y="925" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#ffffff">ASG changes the number of EC2 instances</text>
</svg>
