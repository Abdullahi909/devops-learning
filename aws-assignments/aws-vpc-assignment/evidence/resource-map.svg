    .mono { font-family: SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #a6b5c3; }
    .blue { fill: #36a9f5; }
    .green { fill: #43d18a; }
    .amber { fill: #ffc04b; }
