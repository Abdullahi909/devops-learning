<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1220" role="img" aria-labelledby="title desc">
<title id="title">Assignment -1 VPC resource map</title>
<desc id="desc">AWS console inspired map of the supplied final-state evidence for Assignment -1 in eu-west-2. The public and private subnets, all three route tables, internet gateway, available NAT gateway with an EIP, active private route, and public EC2 are confirmed. Private EC2 evidence has not been supplied.</desc>
<defs>
