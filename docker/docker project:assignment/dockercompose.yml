version: '3.8'

services:
  web:

    build: .
    environment:
      - DB_HOST=postgres
      - DB_NAME=appdb
      - DB_USER=appuser
      - DB_PASS=apppassword

    depends_on:
      - postgres


  postgres:

    image: postgres
    environment:
      - POSTGRES_PASSWORD=apppassword
      - POSTGRES_USER=appuser
      - POSTGRES_DB=appdb
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:


  nginx:

    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    ports:
      - "80:80"
